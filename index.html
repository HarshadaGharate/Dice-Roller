<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice-Roller</title>
    <style>
        body{
            background-color: #D1F8EF;
        }
        h1{
            text-align: center;
            color: #003380;
        }
        .container{
            width: 400px;
            border: 1px solid grey;
            display: block;
            margin: 40px auto;
            box-shadow: 1px 1px 5px 0.5px #3674B5;
            background-color: white;
        }
        .dice-img{
            height: 200px;
            display: block;
            margin: 20px auto;
            padding: 10px;
        }
        .btn{
            font-size: 25px;
            display: block;
            margin: 20px auto;
            background-color: #578FCA;
            color: white;
            padding: 5px 40px;
            border-radius: 10px;
            border: none;
        }
        .text{
            text-align: center;
            font-size: 20px;
            margin-bottom: 50px;
            margin-top: 30px;
            color: #001433;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dice Roller</h1>
        <img src="./images/dice.png" alt="Dice" class="dice-img" id="dice">
        <button type="button" class="btn" onclick="diceRoller()">Roll Dice</button>
        <p class="text" id="para">Click the button to roll the dice!</p>
    </div>

    <script>
        function diceRoller(){
            const min=1;
            const max=6;
            const random=Math.floor(Math.random()*(max-min+1))+min;
            const diceImg=document.getElementById("dice");
            const textElement=document.getElementById("para");
            if(random==1){
                diceImg.src="./images/one.png";
                textElement.innerText="You rolled at 1!"
            }
            else if(random==2){
                diceImg.src="./images/two.png";
                textElement.innerText="You rolled at 2!";
            }
            else if(random==3){
                diceImg.src="./images/three.png";
                textElement.innerText="You rolled at 3!";
            }
            else if(random==4){
                diceImg.src="./images/four.png";
                textElement.innerText="You rolled at 4!";
            }
            else if(random==5){
                diceImg.src="./images/five.png";
                textElement.innerText="You rolled at 5!";
            }
            else{
                diceImg.src="./images/six.png";
                textElement.innerText="You rolled at 6!";
            }
        }
    </script>
</body>
</html>
