<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice-Roller</title>
    <style>
        h1{
            text-align: center;
        }
        .container{
            width: 500px;
            border: 1px solid grey;
            display: block;
            margin: 40px auto;
            box-shadow: 1px 1px 5px 0.5px grey;
        }
        .dice-img{
            height: 200px;
            display: block;
            margin: 20px auto;
        }
        .btn{
            font-size: 25px;
            display: block;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dice Roller</h1>
        <img src="./images/dice.png" alt="Dice" class="dice-img">
        <button type="button" class="btn">Roll Dice</button>
    </div>
</body>
</html>
